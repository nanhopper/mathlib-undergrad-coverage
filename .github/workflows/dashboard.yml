name: Mathlib coverage dashboard

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - '!web/data.json'  # the weekly commit below must not retrigger this
      - 'tests/**'
      - '.github/workflows/dashboard.yml'

permissions: {}

concurrency:
  # PR validation must not replace a pending main-branch publication.
  group: undergrad-dashboard-${{ github.ref }}
  # Never cancel a run that may be midway through a Pages deployment.
  cancel-in-progress: false

jobs:
  test:
    name: Validate coverage and frontend models
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml pytest

      - run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test tests/dashboard-model.test.mjs

      - run: python scripts/validate_coverage.py web/data.json

  build:
    name: Build the dashboard
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit the refreshed data back to the repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml

      - name: Restore the upstream caches
        uses: actions/cache@v4
        with:
          path: .mathlib-cache
          key: coverage-sources-v2-${{ github.run_id }}
          restore-keys: coverage-sources-v2-

      - name: Extract both coverage benchmarks from pinned upstream revisions
        run: |
          python3 scripts/extract_undergrad_history.py \
            --clone \
            --cache .mathlib-cache \
            --output web/data.json

      - name: Commit the refreshed data
        # Keeps a durable record of every reading and, just as importantly,
        # counts as repository activity: GitHub disables scheduled workflows
        # after 60 days without any, which would silently kill this dashboard.
        # Pushes made with GITHUB_TOKEN do not trigger workflows, so this
        # cannot loop; the path filter above is a second line of defence.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "chore: refresh mathematical coverage data"
          # Never replay an old-schema artifact onto different producer/UI code.
          # A rejected push leaves the last good deployment intact; rerun from
          # the newer main revision instead.
          git push origin HEAD:main

      - name: Upload the dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report-failure:
    name: Report a failure
    needs: [test, build, deploy]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # This repository exists only to run this job, so a silent failure would
      # otherwise go unnoticed until someone happened to look at the dashboard.
      # This job deliberately does not check the repository out, so `gh` has no
      # local git remote to infer the repository from; GH_REPO supplies it.
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Undergraduate coverage dashboard failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The dashboard failed again: $RUN_URL"
          else
            gh issue create --title "$title" \
              --body "The weekly dashboard run failed: $RUN_URL"
          fi
